apiVersion: apps/v1
kind: Deployment
metadata:
  name: smp-coupon-svc
  namespace: smp-coupon
  labels:
    app: smp-coupon-svc
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smp-coupon-svc
  template:
    metadata:
      labels:
        app: smp-coupon-svc
    spec:
      containers:
      - name: app
        # Phase 3 (CI/CD) 에서 실제 이미지로 교체됨
        # image: ghcr.io/YOUR_GITHUB_USERNAME/smp-coupon-svc:latest
        image: eclipse-temurin:21-jre-alpine
        command: ["sh", "-c", "echo 'Placeholder: Phase 3에서 실제 이미지로 교체됩니다'; sleep infinity"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: spring.profiles.active
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: database.url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: SPRING_DATA_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: redis.host
        - name: SPRING_DATA_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: redis.port
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          failureThreshold: 3
