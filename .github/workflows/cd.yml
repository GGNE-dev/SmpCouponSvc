# ============================================================
# CD (Continuous Delivery) 워크플로우
# ============================================================
# 언제 실행되나:
#   - main 브랜치에 push할 때 (CI 통과 후)
#   - v* 태그 푸시할 때 (예: v1.0.0 → 정식 릴리즈)
#
# 하는 일:
#   1. 코드 체크아웃
#   2. JDK 21 셋업
#   3. bootJar 빌드
#   4. GHCR(GitHub Container Registry)에 로그인
#   5. Docker 이미지 빌드 + 태그 생성
#   6. GHCR에 이미지 푸시
#
# 결과:
#   ghcr.io/YOUR_USERNAME/smpcouponsvc:main  ← 최신 main 브랜치
#   ghcr.io/YOUR_USERNAME/smpcouponsvc:v1.0.0 ← 태그 릴리즈
# ============================================================

name: CD

on:
  push:
    branches: [ "main" ]    # main 브랜치 push 시
    tags:
      - 'v*'                # v1.0.0 같은 태그 push 시

# 환경변수: 워크플로우 전체에서 공통으로 사용
env:
  REGISTRY: ghcr.io                          # GitHub Container Registry 주소
  IMAGE_NAME: ${{ github.repository }}       # "username/SmpCouponSvc" 형태로 자동 설정

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    # ── 권한 설정 ─────────────────────────────────────────────
    # packages: write → GHCR에 이미지 푸시 권한
    # contents: read → 저장소 코드 읽기 권한
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. 코드 체크아웃 ─────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. JDK 21 설치 ───────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ── 3. gradlew 실행 권한 ─────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. JAR 빌드 ──────────────────────────────────────────
      # Dockerfile의 Stage 1과 동일한 작업
      # CI에서 이미 테스트 통과했으므로 여기선 테스트 스킵
      - name: Build with Gradle
        run: ./gradlew bootJar -x test --no-daemon

      # ── 5. Docker Buildx 설정 ────────────────────────────────
      # Buildx: 멀티 플랫폼 이미지 빌드 지원 (ARM, AMD64 동시 빌드 가능)
      # GitHub Actions 캐시와 통합이 더 잘 됨
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 6. GHCR 로그인 ───────────────────────────────────────
      # GITHUB_TOKEN: GitHub이 자동으로 발급하는 임시 토큰
      # 별도 시크릿 설정 없이 바로 사용 가능
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}           # push한 사람의 GitHub 아이디
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub 자동 발급 토큰

      # ── 7. 이미지 메타데이터(태그) 생성 ─────────────────────
      # 상황에 따라 다른 태그를 자동 생성:
      #   - main 브랜치 push → :main 태그
      #   - v1.0.0 태그 push → :v1.0.0, :1.0 태그
      #   - 모든 경우 → :main-abc1234 (브랜치+커밋SHA) 태그
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      # ── 8. Docker 이미지 빌드 + GHCR 푸시 ───────────────────
      # context: . → 현재 디렉토리를 빌드 컨텍스트로 사용
      # push: true → 빌드 후 즉시 GHCR에 푸시
      # cache-from/to: GitHub Actions 캐시 활용 → 반복 빌드 시 속도 향상
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 9. 푸시된 이미지 다이제스트 출력 ────────────────────
      # 다이제스트: 이미지의 고유 해시값 (sha256:abc...)
      # 태그는 변경될 수 있지만 다이제스트는 불변 → 보안/감사 용도
      - name: Print image digest
        run: echo "Image pushed ${{ steps.build-push.outputs.digest }}"
