services:
  mysql:
    image: mysql:8.0
    container_name: coupon-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon_db
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon123
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
