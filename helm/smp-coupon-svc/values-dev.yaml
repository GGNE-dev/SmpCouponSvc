# values-dev.yaml - 개발 환경 override 파일
# values.yaml의 기본값 중 개발 환경에서 달라지는 값만 작성
# 나머지는 values.yaml 기본값 그대로 사용

app:
  # 개발 환경은 Pod 1개면 충분
  replicaCount: 1
  image:
    # 개발 브랜치 이미지 태그
    tag: "dev"

# 개발 환경은 트래픽이 없으므로 자동 스케일링 불필요
autoscaling:
  enabled: false

spring:
  profiles:
    active: local  # application-local.yml 활성화
